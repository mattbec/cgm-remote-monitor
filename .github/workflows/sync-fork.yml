name: Fork synchronisieren

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig, um die gesamte Git-Historie zu laden

      - name: Sync upstream
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Original-Repository (Upstream) hinzufügen und abrufen
          git remote add upstream https://github.com/nightscout/cgm-remote-monitor.git
          git fetch upstream master

          # In den master wechseln
          git checkout master
          
          # Lokalen Stand auf den Stand von Upstream bringen und eigene Commits hinten anstellen
          git rebase upstream/master

          # Mit Force-Push den eigenen Fork überschreiben (erlaubt das Überschreiben der alten Historie)
          git push origin master --force-with-lease
