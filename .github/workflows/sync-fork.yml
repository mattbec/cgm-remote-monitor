name: Fork synchronisieren

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig, um die gesamte Git-Historie zu laden

      - name: Sync upstream
        run: |
          # Git Identität für den automatischen Commit setzen
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Original-Repository (Upstream) hinzufügen und abrufen
          git remote add upstream https://github.com/nightscout/cgm-remote-monitor.git # URL des Originals anpassen!
          git fetch upstream master

          # In den eigenen master wechseln und Änderungen mergen
          git checkout master
          git pull origin master
          git rebase upstream/master

          # Aktualisierten Stand in Ihren eigenen Fork pushen
          git push origin master
